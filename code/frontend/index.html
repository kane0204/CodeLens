<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>CodeLens 代码分析</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%238b5e34'/%3E%3Cpath d='m13 9-7 7 7 7m6-14 7 7-7 7' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">跳到主要内容</a>
  <div id="app"><main class="import-page"><section class="import-card"><h1>CodeLens 代码分析</h1><p role="status">正在连接分析服务</p><div class="skeleton"></div></section></main></div>
  <input id="folder-input" type="file" webkitdirectory multiple hidden aria-label="选择 Python 项目文件夹">
  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title"><h2 id="confirm-title">重新导入项目</h2><p>新分析成功后替换当前结果。中止或失败时仍可查看上一次结果。</p><div class="actions"><button data-action="close-dialog" aria-label="取消重新导入">取消</button><button class="primary" data-action="confirm-import" aria-label="确定重新导入">确定</button></div></dialog>
  <dialog id="detail-dialog" class="wide-dialog" aria-label="详细内容"></dialog>
  <noscript>请启用 JavaScript 后使用本地分析工作台。</noscript>
</body>
</html>
